name: Keep Supabase alive

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Longitud URL: ${#SB_URL}"
          echo "Longitud KEY: ${#SB_KEY}"
          curl -fsS "$SB_URL/rest/v1/templos?select=id&limit=1" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY"
