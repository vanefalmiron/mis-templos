name: Keep Supabase alive

on:
  schedule:
    - cron: "0 8 * * 1,4"   # lunes y jueves a las 08:00 UTC
  workflow_dispatch:         # para lanzarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/templos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
